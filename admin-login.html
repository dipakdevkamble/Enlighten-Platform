<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Login | Enlighten</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <main class="auth login-page">
    <section class="auth-card auth-card--compact" aria-label="Admin login">
      <header class="auth-head">
        <h1>Admin Login</h1>
        <p class="sub">Use an account marked as admin in Supabase.</p>
      </header>

      <form class="auth-form" data-auth-form="admin-login" novalidate>
        <div class="field">
          <span>Email</span>
          <div class="input-wrap">
            <input id="email" name="email" type="email" placeholder="Admin email" required />
          </div>
        </div>

        <div class="field">
          <span>Password</span>
          <div class="input-wrap">
            <input id="password" name="password" type="password" placeholder="Admin password" required />
          </div>
        </div>

        <p class="form-message" role="status" aria-live="polite"></p>

        <button class="btn primary" type="submit">Login as Admin</button>

        <p class="foot">Student account? <a class="link" href="login.html">Student login</a></p>
      </form>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="auth.js" defer></script>
</body>
</html>
