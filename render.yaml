services:
  - type: web
    name: enlighten-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py migrate && gunicorn config.wsgi:application
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: enlighten-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://your-frontend-domain.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://your-frontend-domain.com
      - key: FRONTEND_URL
        value: https://your-frontend-domain.com
      - key: FRONTEND_OAUTH_REDIRECT_URL
        value: https://your-frontend-domain.com/auth.html
      - key: BACKEND_BASE_URL
        value: https://enlighten-backend.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: enlighten-db
          property: connectionString
      - key: DB_SSLMODE
        value: require
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GITHUB_OAUTH_CLIENT_ID
        sync: false
      - key: GITHUB_OAUTH_CLIENT_SECRET
        sync: false

databases:
  - name: enlighten-db
    databaseName: enlighten
    user: enlighten
