<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Request a password reset for an Enlighten student or admin account." />
  <title>Forgot Password | Enlighten</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <main class="auth login-page">
    <section class="auth-card auth-card--compact" aria-label="Forgot password">
      <header class="auth-head">
        <h1>Reset Password</h1>
        <p class="sub">Enter your email to request account recovery.</p>
      </header>

      <form class="auth-form" data-auth-form="forgot" novalidate>
        <div class="field">
          <span>Email</span>
          <div class="input-wrap">
            <input id="email" name="email" type="email" placeholder="Enter your email" required />
          </div>
        </div>

        <p class="form-message" role="status" aria-live="polite"></p>

        <button class="btn primary" type="submit">Request Reset</button>

        <p class="foot">Remember your password? <a class="link" href="login.html">Log in</a></p>
      </form>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="auth.js" defer></script>
</body>
</html>
