<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Search published Enlighten class test results securely after login." />
  <title>Class Test Result | Enlighten</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="result.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">Enlighten</a>
    <nav aria-label="Primary navigation">
      <a href="index.html">Home</a>
      <a href="Notes.html">Notes</a>
      <a href="Papers.html">Papers</a>
      <a href="Lectures.html">Lectures</a>
      <a href="About.html">About</a>
      <a href="result.html" aria-current="page">Results</a>
      <button class="nav-button" id="logoutButton" type="button">Logout</button>
    </nav>
  </header>

  <main class="result-shell">
    <p class="page-alert" id="pageAlert" role="alert" hidden></p>

    <div class="workspace">
      <section class="panel lookup-panel" aria-labelledby="lookupHeading">
        <p class="eyebrow">Search</p>
        <h1 id="lookupHeading">Find Result</h1>

        <form class="lookup-form" id="resultForm" novalidate>
          <div class="field">
            <label for="name">Student Name</label>
            <input id="name" name="name" type="text" placeholder="Student full name" autocomplete="name" required />
          </div>

          <div class="split">
            <div class="field">
              <label for="roll">Roll No</label>
              <input id="roll" name="roll" type="text" placeholder="21" autocomplete="off" required />
            </div>

            <div class="field">
              <label for="test">Test Name</label>
              <input id="test" name="test" type="text" list="testOptions" placeholder="Class Test 1" autocomplete="off" required />
            </div>
          </div>

          <div class="field">
            <label for="subject">Subject</label>
            <input id="subject" name="subject" type="text" list="subjectOptions" placeholder="Computer Graphics" autocomplete="off" required />
          </div>

          <div class="actions">
            <button class="primary" id="findButton" type="submit" disabled>
              <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <circle cx="11" cy="11" r="7"></circle>
                <path d="m20 20-4-4"></path>
              </svg>
              Search
            </button>
            <button id="resetButton" type="button">
              <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M3 12a9 9 0 1 0 3-6.7"></path>
                <path d="M3 4v6h6"></path>
              </svg>
              Reset
            </button>
            <button id="printButton" type="button">
              <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M6 9V3h12v6"></path>
                <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
                <path d="M6 14h12v7H6z"></path>
              </svg>
              Print
            </button>
          </div>

          <p class="message" id="formMessage" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section class="panel result-panel" aria-labelledby="resultHeading">
        <div class="result-top">
          <div>
            <p class="eyebrow">Summary</p>
            <h2 id="resultHeading">Result Details</h2>
          </div>
          <div class="status-pill" id="resultStatus" role="status" aria-live="polite">Not searched</div>
        </div>

        <div class="empty-state" id="emptyState">No result loaded.</div>

        <div class="result-sheet" id="resultSheet" hidden>
          <div class="student-band">
            <div>
              <span>Student</span>
              <strong id="outName">-</strong>
            </div>
            <div class="marks-badge">
              <span>Marks</span>
              <strong id="outMarks">-</strong>
            </div>
          </div>

          <div class="result-details">
            <div class="detail-row">
              <span>Roll No</span>
              <strong id="outRoll">-</strong>
            </div>
            <div class="detail-row">
              <span>Subject</span>
              <strong id="outSubject">-</strong>
            </div>
            <div class="detail-row">
              <span>Test Name</span>
              <strong id="outTest">-</strong>
            </div>
            <div class="detail-row">
              <span>Status</span>
              <strong id="outStatus">Published</strong>
            </div>
          </div>

          <p class="result-note" id="resultNote"></p>
        </div>
      </section>
    </div>
  </main>

  <datalist id="subjectOptions">
    <option value="Basic Electrical Engineering"></option>
    <option value="Basic Electronics Engineering"></option>
    <option value="Engineering Chemistry"></option>
    <option value="Engineering Graphics"></option>
    <option value="Engineering Mathematics - I"></option>
    <option value="Engineering Mathematics - II"></option>
    <option value="Engineering Mechanics"></option>
    <option value="Engineering Physics"></option>
    <option value="Systems in Mechanical Engineering"></option>
    <option value="Computer Graphics"></option>
    <option value="Data Structures &amp; Algorithms"></option>
    <option value="Database Management System"></option>
    <option value="Digital Electronics &amp; Logic Design"></option>
    <option value="Discrete Mathematics"></option>
    <option value="Engineering Mathematics III"></option>
    <option value="Object Oriented Programming"></option>
    <option value="Operating Systems"></option>
    <option value="Principles of Communication Systems"></option>
    <option value="Signals &amp; Systems"></option>
    <option value="Software Engineering"></option>
    <option value="Statistics"></option>
  </datalist>
  <datalist id="testOptions"></datalist>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="result.js"></script>
</body>
</html>
