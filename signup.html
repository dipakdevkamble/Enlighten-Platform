<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Create an Enlighten account to access engineering notes, papers, and results." />
  <title>Create Account | Enlighten</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="signup.css" />
  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="auth.js" defer></script>
</head>
<body>
  <main class="auth-card">
    <header class="auth-head">
      <div class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false">
          <path d="M12 3 20 6v5c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10V6l8-3Z"></path>
          <path d="m8.5 12 2.2 2.2 4.8-5"></path>
        </svg>
      </div>
      <h1>Create an account</h1>
      <p class="sub">Create your account and start learning.</p>
    </header>

    <form class="auth-form" data-auth-form="signup" novalidate>
      <div class="grid2">
        <div class="field">
          <label for="first-name">First Name</label>
          <div class="input-wrap">
            <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <circle cx="12" cy="8" r="4"></circle>
              <path d="M4 21a8 8 0 0 1 16 0"></path>
            </svg>
            <input type="text" id="first-name" name="firstName" placeholder="First name" autocomplete="given-name" required />
          </div>
        </div>
        <div class="field">
          <label for="last-name">Last Name</label>
          <div class="input-wrap">
            <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <circle cx="12" cy="8" r="4"></circle>
              <path d="M4 21a8 8 0 0 1 16 0"></path>
            </svg>
            <input type="text" id="last-name" name="lastName" placeholder="Last name" autocomplete="family-name" required />
          </div>
        </div>
      </div>

      <div class="field">
        <label for="email">Email Address</label>
        <div class="input-wrap">
          <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="3" y="5" width="18" height="14" rx="2"></rect>
            <path d="m4 7 8 6 8-6"></path>
          </svg>
          <input type="email" id="email" name="email" placeholder="abc@gmail.com" autocomplete="email" spellcheck="false" required />
        </div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="4" y="10" width="16" height="11" rx="2"></rect>
            <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
          </svg>
          <input type="password" id="password" name="password" placeholder="Enter 8+ characters" autocomplete="new-password" minlength="8" required />
        </div>
      </div>

      <div class="field">
        <label for="confirmPassword">Confirm Password</label>
        <div class="input-wrap">
          <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="4" y="10" width="16" height="11" rx="2"></rect>
            <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
            <path d="M12 14v3"></path>
          </svg>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm password" autocomplete="new-password" minlength="8" required />
        </div>
      </div>

      <p class="form-message" role="status" aria-live="polite"></p>
      <button type="submit" class="btn primary">Get Started</button>
    </form>

    <footer class="auth-footer">
      Already have an account? <a href="login.html" class="link">Log in</a>
    </footer>
  </main>
</body>
</html>
