<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset Password | Enlighten</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <main class="auth login-page">
    <section class="auth-card auth-card--compact" aria-label="Reset password">
      <header class="auth-head">
        <h1>Set New Password</h1>
        <p class="sub">Create a new password for your Enlighten account.</p>
      </header>

      <form class="auth-form" id="resetPasswordForm" novalidate>
        <div class="field">
          <span>New Password</span>
          <div class="input-wrap">
            <input id="password" name="password" type="password" placeholder="Enter 8+ characters" minlength="8" required />
          </div>
        </div>

        <div class="field">
          <span>Confirm Password</span>
          <div class="input-wrap">
            <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Confirm password" minlength="8" required />
          </div>
        </div>

        <p class="form-message" role="status" aria-live="polite"></p>

        <button class="btn primary" type="submit">Update Password</button>

        <p class="foot">Already reset it? <a class="link" href="login.html">Log in</a></p>
      </form>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="reset-password.js" defer></script>
</body>
</html>
